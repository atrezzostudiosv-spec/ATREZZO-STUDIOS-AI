name: HOME V06 Original — Preview gate
on:
  push:
    branches: [preview-v06-original-brand, main]
    paths:
      - 'public/preview/v06-original/**'
      - 'tests/v06-original-gate.mjs'
      - '.github/workflows/v06-original-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated assets and brand
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('public/preview/v06-original')
          forbidden=b'tri'+b'onn'
          files=[p for p in root.rglob('*') if p.is_file()]
          assert len(files)==432, len(files)
          frames=list((root/'assets/service-frames').glob('*.svg'))
          assert len(frames)==371 and len({p.read_bytes() for p in frames})==371
          for p in files:
              assert forbidden not in str(p).lower().encode(), str(p)
              assert forbidden not in p.read_bytes().lower(), str(p)
          print('432 files, 371 unique frames, zero former-brand references')
          PY
          find public/preview/v06-original -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - if: github.ref != 'refs/heads/main'
        run: node tests/v06-original-gate.mjs public/preview/v06-original /ATREZZO-STUDIOS-AI/public/preview/v06-original
      - name: Verify exact deployed pages and preserved Coming Soon
        if: github.ref == 'refs/heads/main'
        env:
          ATREZZO_ONLINE_BASE: https://atrezzostudiosv-spec.github.io/ATREZZO-STUDIOS-AI/public/preview/v06-original/
        run: |
          set -e
          root=public/preview/v06-original
          matched=0
          for attempt in $(seq 1 30); do
            if curl -fsSL --max-time 20 "${ATREZZO_ONLINE_BASE}en/" -o /tmp/v06-en.html && cmp -s "$root/en/index.html" /tmp/v06-en.html &&
               curl -fsSL --max-time 20 "${ATREZZO_ONLINE_BASE}es/" -o /tmp/v06-es.html && cmp -s "$root/es/index.html" /tmp/v06-es.html; then matched=1; break; fi
            sleep 10
          done
          test "$matched" = 1
          curl -fsSL --max-time 20 https://atrezzostudiosv-spec.github.io/ATREZZO-STUDIOS-AI/public/ -o /tmp/coming-soon.html
          cmp public/index.html /tmp/coming-soon.html
          echo "HTTP 200 and exact deployed EN/ES HTML and Coming Soon verified"
      - name: Reuse original gate on live Pages
        if: github.ref == 'refs/heads/main'
        env:
          ATREZZO_ONLINE_BASE: https://atrezzostudiosv-spec.github.io/ATREZZO-STUDIOS-AI/public/preview/v06-original/
        run: node tests/v06-original-gate.mjs public/preview/v06-original /ATREZZO-STUDIOS-AI/public/preview/v06-original
