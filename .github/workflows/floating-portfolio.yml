name: ATZ-SEC-012 — Coming Soon lab QA
on:
  push:
    branches: [main]
    paths:
      - 'public/lab/floating-portfolio/**'
      - 'public/_headers'
      - 'tests/floating-portfolio.mjs'
      - '.github/workflows/floating-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright gsap@3.15.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/floating-portfolio.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atrezzo-floating-portfolio-qa
          path: qa-floating-portfolio/
