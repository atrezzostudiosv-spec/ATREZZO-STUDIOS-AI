name: HOME V07 — H03 continuous space pilot
on:
  push:
    branches: [preview-v07-h03, main]
    paths:
      - 'public/preview/v07/**'
      - 'tests/v07-h03-gate.mjs'
      - '.github/workflows/v07-h03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        lang: [en, es]
    env:
      ATREZZO_BROWSER: ${{ matrix.browser }}
      ATREZZO_LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect V06 and verify exact component assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          v6=Path('public/preview/v06-original')
          v7=Path('public/preview/v07')
          base='34e0febd54c314648cd9788bbfb21792e9592cad'
          import subprocess
          assert not subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','public/preview/v06-original','public/index.html','public/preview/v06-native']).strip()
          assert len(list((v7/'assets/service-frames').glob('*.svg')))==371
          for p in (v6/'assets/service-frames').glob('*.svg'):
              assert p.read_bytes()==(v7/'assets/service-frames'/p.name).read_bytes()
          forbidden=b'tri'+b'onn'
          for p in v7.rglob('*'):
              if p.is_file():
                  assert forbidden not in p.read_bytes().lower(), str(p)
                  assert b'/public/preview/v06-original/' not in p.read_bytes(), str(p)
          assert (v7/'service-frame-engine.js').read_bytes()==(v6/'service-frame-engine.js').read_bytes().replace(b'/public/preview/v06-original/',b'/public/preview/v07/')
          artwork={'express-laptop.webp':'d61e6b121e23fe0056ac9d73a19e6f414581891a','express-phone.webp':'a072589f4699822f87108ebf9064618a4af5170f','custom-back.webp':'da74906741ee9856387477f68de74ba3ab423183','custom-side.webp':'defed7dfa3e3f3edd0921468ed13776109d6cce1','custom-main.webp':'9844186d0399d6747978fa49926768b135fa6635','custom-low.webp':'192e59e17360e5d9dd1e7365377865db48726cac'}
          for name,sha in artwork.items():
              raw=(v7/'assets/h03'/name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\x00'+raw).hexdigest()==sha,name
          print('Six transparent approved-reference layers verified')
          print('V06 intact, 371 exact frames, exact frame engine except isolated asset prefix, zero former-brand references')
          PY
          find public/preview/v07 -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm install --no-save --no-audit --no-fund --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps $ATREZZO_BROWSER
      - run: node tests/v07-h03-gate.mjs public/preview/v07 /ATREZZO-STUDIOS-AI/public/preview/v07
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v07-h03-screenshots-${{ matrix.browser }}-${{ matrix.lang }}
          path: qa-v07/
          if-no-files-found: ignore
