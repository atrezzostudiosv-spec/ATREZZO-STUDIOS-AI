name: Coming Soon root QA (isolated branch)
on:
  push:
    branches: [flagship-development]
    paths:
      - 'tests/coming-soon-root.mjs'
      - '.github/workflows/coming-soon-root-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-root:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/coming-soon-root.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coming-soon-root-qa
          path: qa-coming-soon-root/
